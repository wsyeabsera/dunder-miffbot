<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dunder Miffbot</title>
  </head>
  <body>
    <main id="stage">
      <canvas id="office"></canvas>
      <h1 class="title">Dunder Miffbot</h1>
      <p class="hint">Click an employee. Drag to pan, wheel to zoom, Q and E to rotate. 1 overhead, 2 follow, 3 their eyes, Esc back.</p>
      <div id="modes" role="group" aria-label="Camera">
        <button data-mode="iso" aria-pressed="true">Overhead <kbd>1</kbd></button>
        <button data-mode="follow" aria-pressed="false">Follow <kbd>2</kbd></button>
        <button data-mode="pov" aria-pressed="false">Their eyes <kbd>3</kbd></button>
      </div>
      <div id="fade"></div>
      <button id="signout" class="signout" hidden>Sign out</button>
    </main>
    <aside id="panel" hidden></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
