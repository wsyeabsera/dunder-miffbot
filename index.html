<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dunder Miffbot</title>
  </head>
  <body>
    <main id="stage">
      <canvas id="office"></canvas>
      <h1 class="title">Dunder Miffbot</h1>
      <p class="hint">Click an employee. Drag to pan, wheel to zoom, Q and E to rotate. 1 overhead, 2 follow, 3 their eyes, 4 walk (WASD, Shift runs, E talks to who you look at), Esc back.</p>
      <div id="modes" role="group" aria-label="Camera">
        <button data-mode="iso" aria-pressed="true">Overhead <kbd>1</kbd></button>
        <button data-mode="follow" aria-pressed="false">Follow <kbd>2</kbd></button>
        <button data-mode="pov" aria-pressed="false">Their eyes <kbd>3</kbd></button>
        <button data-mode="walk" aria-pressed="false">Walk <kbd>4</kbd></button>
      </div>
      <aside id="people" aria-label="People"><input type="search" placeholder="Find someone" aria-label="Find someone"><ul></ul></aside>
      <canvas id="minimap" width="240" aria-label="Map of the building"></canvas>
      <div id="crosshair" hidden data-target=""><span class="dot"></span><span class="who"></span></div>
      <div id="fade"></div>
      <p id="loading">Opening the office...</p>
      <button id="signout" class="signout" hidden>Sign out</button>
    </main>
    <aside id="panel" hidden></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
