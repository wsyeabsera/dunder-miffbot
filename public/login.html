<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in - Dunder Miffbot</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1d2433; color: #e8ecf5; font: 14px/1.45 system-ui, sans-serif; }
  main { width: min(400px, calc(100% - 32px)); padding: 32px; border: 1px solid #2b3550; border-radius: 16px; background: #151b28; }
  h1 { margin: 0 0 6px; font-size: 24px; }
  p { margin: 0; color: #98a2bb; }
  label { display: block; margin: 22px 0 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #98a2bb; }
  input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid #2b3550; border-radius: 10px; background: #1d2433; color: inherit; font: inherit; }
  input:focus-visible, button:focus-visible { outline: 2px solid #7aa2ff; outline-offset: 2px; }
  input[aria-invalid="true"] { border-color: #ff7a8a; }
  #msg { min-height: 1.4em; margin-top: 8px; color: #ff7a8a; }
  button { width: 100%; height: 42px; margin-top: 8px; border: 0; border-radius: 10px; background: #7aa2ff; color: #0a0c13; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
<main>
  <form id="login">
    <h1>Dunder Miffbot</h1>
    <p>Enter the password to visit the office.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" aria-describedby="msg" autofocus required>
    <p id="msg" role="alert"></p>
    <button type="submit">Sign in</button>
  </form>
</main>
<script>
  const form = document.getElementById("login");
  const pw = document.getElementById("pw");
  const msg = document.getElementById("msg");
  const button = form.querySelector("button");
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    button.disabled = true;
    msg.textContent = "";
    pw.removeAttribute("aria-invalid");
    try {
      const res = await fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pw.value }) });
      if (res.ok) return location.replace("/");
      msg.textContent = res.status === 429 ? "Too many tries. Wait a minute." : res.status === 401 ? "Wrong password." : "Could not sign in.";
      pw.setAttribute("aria-invalid", "true");
    } catch {
      msg.textContent = "Could not reach the server.";
    }
    button.disabled = false;
    pw.select();
  });
</script>
</body>
</html>
